# This workflow runs automatically when a GitHub release is published.
# It publishes both the native packages and `@matrix-org/seshat`.

name: Publish

permissions: {}

on:
  release:
    types: [published]

jobs:
  discover-targets:
    name: Discover release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: discover
        run: bash .github/workflows/scripts/discover-release-targets.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  publish-native-packages:
    name: Publish ${{ matrix.package-name }}
    needs: [discover-targets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-targets.outputs.targets) }}
    uses: ./.github/workflows/publish-native.yml
    permissions:
      contents: read
      id-token: write
    with:
      release-tag: ${{ github.event.release.tag_name }}
      artifact-name: ${{ matrix.artifact-name }}
      package-name: ${{ matrix.package-name }}
      pkg-os: ${{ matrix.pkg-os }}
      pkg-cpu: ${{ matrix.pkg-cpu }}

  publish-main:
    name: Publish main package
    needs: [publish-native-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # Ignore caching for releases

      # NPM trusted publishing needs npm >= 11.5.1.
      - name: Install npm 11
        run: npm install --global npm@11

        # Pin optionalDependencies to this exact release before publishing the
        # main package, so the JS wrapper and native binaries never drift.
      - name: Publish
        working-directory: seshat-node
        run: |
          npm pkg set version="$RELEASE_TAG"
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            npm pkg set "optionalDependencies.@matrix-org/seshat-$pkg=$RELEASE_TAG"
          done
          npm publish --access public --provenance --publish-branch main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
