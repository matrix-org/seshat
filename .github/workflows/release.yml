name: Release

permissions: {}

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build (Linux / MacOS)
    permissions:
      contents: read
    uses: ./.github/workflows/build-native.yml

  # Windows has complex needs and thus needs it's own workflow.
  build-windows:
    name: Build (Windows)
    permissions:
      contents: read
    uses: ./.github/workflows/build-native-windows.yml

  release:
    name: Create GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Collect .node files
        run: |
          mkdir -p dist
          find artifacts/ -name "*.node" -exec mv {} dist/ \;

      - name: Generate checksums
        run: sha256sum dist/*.node > dist/checksums.txt

      - name: Create draft GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            dist/*.node \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
