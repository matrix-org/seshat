# This creates a draft GitHub release when a release tag is pushed.

name: Release


permissions: {}

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build-native.yml

  draft-release:
    name: Create draft GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          # Each artifact is named after the file it contains, so without this
          # we'd get artifacts/foo.node/foo.node and the `find` below would
          # match the directory rather than the file.
          merge-multiple: true

      - name: Collect .node files
        run: |
          mkdir -p dist
          find artifacts/ -type f -name "*.node" -exec mv -t dist/ {} +

      - name: Create draft GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            dist/*.node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
