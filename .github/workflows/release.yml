name: Release

permissions: {}

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-x64.node
            use-cross: false
            sqlcipher: bundled
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-x64-dynamic.node
            use-cross: false
            sqlcipher: dynamic
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-arm64.node
            use-cross: true
            sqlcipher: bundled
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-arm64-dynamic.node
            use-cross: true
            sqlcipher: dynamic
          - os: macos-13
            target: x86_64-apple-darwin
            artifact-name: matrix-seshat-darwin-x64.node
            use-cross: false
            sqlcipher: bundled
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: matrix-seshat-darwin-arm64.node
            use-cross: false
            sqlcipher: bundled
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: matrix-seshat-win32-x64.node
            use-cross: false
            sqlcipher: bundled

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup install stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        uses: taiki-e/install-action@85b24a67ef0c632dfefad70b9d5ce8fddb040754 # v2.75.10
        with:
          tool: cross

      - name: Install libsqlcipher-dev (Linux, dynamic)
        if: runner.os == 'Linux' && matrix.sqlcipher == 'dynamic' && matrix.use-cross == false
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libsqlcipher-dev

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "18"
          package-manager-cache: false # Ignore caching for releases

      - name: Install node dependencies
        working-directory: seshat-node
        run: yarn install

      - name: Build (native)
        if: matrix.use-cross == false
        working-directory: seshat-node
        shell: bash
        run: |
          if [ "${{ matrix.sqlcipher }}" = "bundled" ]; then
            yarn run build-bundled --target ${{ matrix.target }}
          else
            yarn run build --target ${{ matrix.target }}
          fi

      - name: Build (cross — Linux ARM64)
        if: matrix.use-cross == true
        working-directory: seshat-node
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          FEATURES=""
          if [ "${{ matrix.sqlcipher }}" = "bundled" ]; then
            FEATURES="--features=bundled-sqlcipher"
          fi
          npx cargo-cp-artifact -nc index.node -- \
            cross build \
              --message-format=json-render-diagnostics \
              --release \
              --target ${{ matrix.target }} \
              $FEATURES

      - name: Rename artifact
        working-directory: seshat-node
        shell: bash
        run: mv index.node ${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: seshat-node/${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Collect .node files
        run: |
          mkdir -p dist
          find artifacts/ -name "*.node" -exec mv {} dist/ \;

      - name: Generate checksums
        run: sha256sum dist/*.node > dist/checksums.txt

      - name: Create draft GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            dist/*.node \
            dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
