name: Build native module

permissions: {}

on:
  workflow_call:
    outputs:
      targets:
        description: >-
          JSON array of {artifact-name, package-name, pkg-os, pkg-cpu} for
          each target this workflow built.
        value: ${{ jobs.targets.outputs.targets }}

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Set of targets to build for. This will be output back to the `release` job
  # so that it may build the correct packages.
  #
  # "runner": Runner used to build the image
  # "target": Target used by rustup
  # "artifact-name": Resulting artifact name for the build
  # "pkg-os": Platform OS used in the package name
  # "pkg-cpu": Platform architecture used in the package name
  # "sqlcipher": "static" (default) or "dynamic" depending on whether we bake in sqlcipher.
  #
  # ## Linux
  # Pinned to 22.04 (rather than ubuntu-latest) to keep the glibc version
  # these binaries link against as low as practical.
  # We also bias to using native runners over cross-compiling to avoid issues
  # like https://github.com/matrix-org/seshat/issues/135.
  #
  # ## MacOS / Windows
  # x64 is native; arm64 is cross-compiled from this same x64 host.
  #
  TARGETS: |
    [
      {
        "runner": "ubuntu-22.04",
        "target": "x86_64-unknown-linux-gnu",
        "artifact-name": "matrix-seshat-linux-x64.node",
        "package-name": "@matrix-org/seshat-linux-x64",
        "pkg-os": "linux",
        "pkg-cpu": "x64"
      },
      {
        "runner": "ubuntu-22.04",
        "target": "x86_64-unknown-linux-gnu",
        "artifact-name": "matrix-seshat-linux-x64-dynamic.node",
        "sqlcipher": "dynamic",
        "package-name": "@matrix-org/seshat-linux-x64-dynamic",
        "pkg-os": "linux",
        "pkg-cpu": "x64"
      },
      {
        "runner": "ubuntu-22.04-arm",
        "target": "aarch64-unknown-linux-gnu",
        "artifact-name": "matrix-seshat-linux-arm64.node",
        "package-name": "@matrix-org/seshat-linux-arm64",
        "pkg-os": "linux",
        "pkg-cpu": "arm64"
      },
      {
        "runner": "ubuntu-22.04-arm",
        "target": "aarch64-unknown-linux-gnu",
        "artifact-name": "matrix-seshat-linux-arm64-dynamic.node",
        "sqlcipher": "dynamic",
        "package-name": "@matrix-org/seshat-linux-arm64-dynamic",
        "pkg-os": "linux",
        "pkg-cpu": "arm64"
      },
      {
        "runner": "macos-latest",
        "target": "x86_64-apple-darwin",
        "artifact-name": "matrix-seshat-darwin-x64.node",
        "package-name": "@matrix-org/seshat-darwin-x64",
        "pkg-os": "darwin",
        "pkg-cpu": "x64"
      },
      {
        "runner": "macos-latest",
        "target": "aarch64-apple-darwin",
        "artifact-name": "matrix-seshat-darwin-arm64.node",
        "package-name": "@matrix-org/seshat-darwin-arm64",
        "pkg-os": "darwin",
        "pkg-cpu": "arm64"
      },
      {
        "runner": "windows-latest",
        "target": "x86_64-pc-windows-msvc",
        "artifact-name": "matrix-seshat-win32-x64.node",
        "package-name": "@matrix-org/seshat-win32-x64",
        "pkg-os": "win32",
        "pkg-cpu": "x64"
      },
      {
        "runner": "windows-latest",
        "target": "aarch64-pc-windows-msvc",
        "artifact-name": "matrix-seshat-win32-arm64.node",
        "package-name": "@matrix-org/seshat-win32-arm64",
        "pkg-os": "win32",
        "pkg-cpu": "arm64"
      }
    ]

jobs:
  targets:
    name: Expose build targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        run: |
          {
            echo 'targets<<TARGETS_EOF'
            echo "$TARGETS"
            echo 'TARGETS_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact-name }}
    needs: [targets]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup install stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Windows Dependencies
        # bundled-sqlcipher pulls in openssl-src, which shells out to `perl`
        # to run OpenSSL's Configure. Git for Windows ships its own minimal
        # perl, missing modules openssl-src's Configure needs (e.g.
        # Locale::Maketext::Simple). `upgrade` is idempotent regardless of
        # preinstalled state; version pinned to what's already on the image
        # so this is a fast no-op.
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          choco upgrade strawberryperl --no-progress -y --version=5.42.0.1
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install libsqlcipher-dev (Linux, dynamic)
        if: runner.os == 'Linux' && matrix.sqlcipher == 'dynamic'
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libsqlcipher-dev

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false # Ignore caching for releases

      - name: Install node dependencies
        working-directory: seshat-node
        run: yarn install

      - name: Build
        working-directory: seshat-node
        shell: bash
        # sqlcipher defaults to bundled when unset (only the two dynamic
        # Linux targets set it explicitly).
        run: |
          if [ "${{ matrix.sqlcipher }}" = "dynamic" ]; then
            yarn run build --target ${{ matrix.target }}
          else
            yarn run build-bundled --target ${{ matrix.target }}
          fi

      - name: Rename artifact
        working-directory: seshat-node
        shell: bash
        run: mv index.node ${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: seshat-node/${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 1
