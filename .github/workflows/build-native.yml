name: Build native module

permissions: {}

on:
  workflow_call:

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04 (rather than ubuntu-latest) to keep the glibc
          # version these binaries link against as low as practical, so
          # they stay loadable on older distros. cross's own docker image
          # sets the real floor for the aarch64 targets below, but we pin
          # the host here too for reproducibility.
          # We support both statically compiling in sqlcipher and
          # dynamically importing it for Linux targets.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-x64.node
            use-cross: false
            sqlcipher: bundled
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-x64-dynamic.node
            use-cross: false
            sqlcipher: dynamic
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-arm64.node
            use-cross: true
            sqlcipher: bundled
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact-name: matrix-seshat-linux-arm64-dynamic.node
            use-cross: true
            sqlcipher: dynamic
          - os: macos-13
            target: x86_64-apple-darwin
            artifact-name: matrix-seshat-darwin-x64.node
            use-cross: false
            sqlcipher: bundled
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: matrix-seshat-darwin-arm64.node
            use-cross: false
            sqlcipher: bundled
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: matrix-seshat-win32-x64.node
            use-cross: false
            sqlcipher: bundled

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup install stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross == true
        uses: taiki-e/install-action@85b24a67ef0c632dfefad70b9d5ce8fddb040754 # v2.75.10
        with:
          tool: cross

      - name: Install libsqlcipher-dev (Linux, dynamic)
        if: runner.os == 'Linux' && matrix.sqlcipher == 'dynamic' && matrix.use-cross == false
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes libsqlcipher-dev

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Strawberry Perl (Windows)
        if: runner.os == 'Windows'
        # bundled-sqlcipher needs a full perl (Git's minimal one lacks
        # modules openssl-src's Configure needs). `upgrade` is idempotent
        # regardless of preinstalled state; version pinned to what's
        # already on the image so this is a fast no-op.
        run: choco upgrade strawberryperl --no-progress -y --version=5.42.0.1

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "18"
          package-manager-cache: false # Ignore caching for releases

      - name: Install node dependencies
        working-directory: seshat-node
        # --ignore-scripts here because we do not want to build on install.
        run: yarn install --ignore-scripts

      - name: Build (native)
        if: matrix.use-cross == false
        working-directory: seshat-node
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
          fi
          if [ "${{ matrix.sqlcipher }}" = "bundled" ]; then
            yarn run build-bundled --target ${{ matrix.target }}
          else
            yarn run build --target ${{ matrix.target }}
          fi

      - name: Build (cross — Linux ARM64)
        if: matrix.use-cross == true
        working-directory: seshat-node
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        # Not using cargo-cp-artifact here: it copies straight from the
        # path in cargo's JSON build messages, but under `cross` that path
        # is the container-internal CARGO_TARGET_DIR, which
        # doesn't exist on the host.
        run: |
          FEATURES=""
          if [ "${{ matrix.sqlcipher }}" = "bundled" ]; then
            FEATURES="--features=bundled-sqlcipher"
          fi
          cross build \
            --release \
            --target ${{ matrix.target }} \
            $FEATURES
          cp ../target/${{ matrix.target }}/release/libmatrix_seshat.so index.node

      - name: Rename artifact
        working-directory: seshat-node
        shell: bash
        run: mv index.node ${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: seshat-node/${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 1
