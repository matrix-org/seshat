name: Build native module (Windows)

permissions: {}

on:
  workflow_call:

concurrency:
  group: build-native-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 is native; arm64 is cross-compiled from this same x64 host.
          # We choose to do this because the only target for ARM on GitHub
          # is Windows 11 and we target Windows 10.
          - target: x86_64-pc-windows-msvc
            artifact-name: matrix-seshat-win32-x64.node
          - target: aarch64-pc-windows-msvc
            artifact-name: matrix-seshat-win32-arm64.node

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        run: |
          rustup install stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install NASM
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Strawberry Perl
        # bundled-sqlcipher pulls in openssl-src, which shells out to `perl`
        # to run OpenSSL's Configure. Git for Windows ships its own minimal
        # perl, missing modules openssl-src's Configure needs (e.g.
        # Locale::Maketext::Simple). `upgrade` is idempotent regardless of
        # preinstalled state; version pinned to what's already on the image
        # so this is a fast no-op.
        run: choco upgrade strawberryperl --no-progress -y --version=5.42.0.1

      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false # Ignore caching for releases

      - name: Install node dependencies
        working-directory: seshat-node
        # --ignore-scripts here because we do not want to build on install.
        run: yarn install --ignore-scripts

      - name: Build
        working-directory: seshat-node
        shell: bash
        run: |
          export PATH="/c/Strawberry/perl/bin:$PATH"
          yarn run build-bundled --target ${{ matrix.target }}

      - name: Rename artifact
        working-directory: seshat-node
        shell: bash
        run: mv index.node ${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: seshat-node/${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 1
